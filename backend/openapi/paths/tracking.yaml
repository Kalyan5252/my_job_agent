/workflows/tracking/run:
  post:
    tags: [Tracking]
    summary: Scan recent emails (IMAP) and advance application statuses
    operationId: runTracking
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/TrackingResult
      "401":
        $ref: ../components/errors.yaml#/Unauthorized
      "500":
        $ref: ../components/errors.yaml#/InternalServerError
