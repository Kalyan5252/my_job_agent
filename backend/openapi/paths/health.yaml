/health:
  get:
    tags: [Health]
    summary: Liveness probe
    operationId: health
    security: []
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/HealthResponse
      "500":
        $ref: ../components/errors.yaml#/InternalServerError
/health/ready:
  get:
    tags: [Health]
    summary: Readiness probe (MongoDB, Postgres, Redis)
    operationId: ready
    security: []
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ReadinessResponse
      "503":
        description: A dependency is unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ErrorResponse
