/auth/login:
  post:
    tags: [Auth]
    summary: Exchange username/password for a bearer token
    operationId: login
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/LoginRequest
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/LoginResponse
      "400":
        $ref: ../components/errors.yaml#/BadRequest
      "401":
        $ref: ../components/errors.yaml#/Unauthorized
      "409":
        description: Password login not configured
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/ErrorResponse
      "429":
        $ref: ../components/errors.yaml#/TooManyRequests
/auth/me:
  get:
    tags: [Auth]
    summary: Show the authenticated principal
    operationId: me
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/Principal
      "401":
        $ref: ../components/errors.yaml#/Unauthorized
      "500":
        $ref: ../components/errors.yaml#/InternalServerError
