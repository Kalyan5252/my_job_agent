ErrorResponse:
  type: object
  required:
    - statusCode
    - error
    - message
  properties:
    statusCode:
      type: integer
      enum:
        - 400
        - 401
        - 429
        - 404
        - 500
    error:
      type: string
    message:
      type: string

JobProfile:
  type: object
  required:
    - role
    - skills
    - experience
  properties:
    role:
      type: string
    skills:
      type: array
      items:
        type: string
    experience:
      oneOf:
        - type: string
          enum:
            - fresher
            - junior
            - mid
            - senior
        - type: string
    computedExperienceYears:
      type: number
      minimum: 0
      description: Computed from candidate profile data when available.

DiscoveryRequest:
  type: object
  additionalProperties: false
  description: >
    Request body for discovery. All fields are optional. Request values override
    environment defaults and profile-derived values.
  properties:
    role:
      type: string
      default: Backend Engineer
      description: Defaults to DEFAULT_JOB_ROLE.
    skills:
      type: array
      items:
        type: string
      description: Defaults to DEFAULT_JOB_SKILLS split by comma.
    experience:
      oneOf:
        - type: string
          enum:
            - fresher
            - junior
            - mid
            - senior
        - type: string
      default: fresher
      description: Defaults to DEFAULT_JOB_EXPERIENCE and is used when computed profile experience is unavailable.
    location:
      type: string
      description: Optional single preferred location.
    locations:
      type: array
      items:
        type: string
      description: >
        Preferred locations. If omitted, locations are derived from country and
        SCRAPER_DEFAULT_COUNTRY.
    country:
      type: string
      default: India
      description: >
        Overrides SCRAPER_DEFAULT_COUNTRY. Used to select country-capable sources
        and country/location filtering.
    remoteOnly:
      type: boolean
      default: false
      description: >
        When true, remote boards are prioritized and country remote searches
        include country-restricted plus worldwide remote roles.
    minSalaryLpa:
      type: number
      minimum: 0
      description: Optional minimum salary in LPA.
    minExperienceYears:
      type: number
      minimum: 0
      description: Overrides computed minimum experience filter.
    maxExperienceYears:
      type: number
      minimum: 0
      description: Overrides computed maximum experience filter.
    maxResults:
      type: integer
      minimum: 1
      default: 50
    companyTierOrder:
      type: array
      items:
        type: string
        enum:
          - top
          - mid
          - other
      default:
        - top
        - mid
        - other
    highPayFirst:
      type: boolean
      default: true

JobPosting:
  type: object
  required:
    - source
    - externalId
    - title
    - company
    - description
  properties:
    source:
      type: string
    externalId:
      type: string
    title:
      type: string
    company:
      type: string
    companyTier:
      type: string
      enum:
        - top
        - mid
        - other
    salaryLpa:
      type: number
    location:
      type: string
    description:
      type: string
    requirements:
      type: array
      items:
        type: string
    applyUrl:
      type: string
      format: uri
    rawData:
      nullable: true
      description: Provider-specific raw payload.

ScoredJob:
  allOf:
    - $ref: "#/JobPosting"
    - type: object
      required:
        - score
        - apply
      properties:
        score:
          type: number
          minimum: 0
          maximum: 100
        apply:
          type: boolean
        reasoning:
          type: string

DiscoveryRunResult:
  type: object
  required:
    - total
    - applyCount
    - jobs
    - diagnostics
  properties:
    total:
      type: integer
    applyCount:
      type: integer
    jobs:
      type: array
      items:
        $ref: "#/ScoredJob"
    diagnostics:
      $ref: "#/DiscoveryDiagnostics"

DiscoveryDiagnostics:
  type: object
  required:
    - counts
    - findings
  properties:
    counts:
      type: object
      required:
        - apiJobs
        - indianJobs
        - htmlJobs
        - browserJobs
        - mergedJobs
        - actionableJobs
        - skillAlignedJobs
        - candidateJobs
        - experienceAlignedJobs
        - prioritizedJobs
      properties:
        apiJobs:
          type: integer
        indianJobs:
          type: integer
          description: Legacy count field currently used for country-source jobs.
        htmlJobs:
          type: integer
        browserJobs:
          type: integer
        mergedJobs:
          type: integer
        actionableJobs:
          type: integer
        skillAlignedJobs:
          type: integer
        candidateJobs:
          type: integer
        experienceAlignedJobs:
          type: integer
        prioritizedJobs:
          type: integer
    findings:
      type: array
      items:
        $ref: "#/DiscoveryFinding"

DiscoveryFinding:
  type: object
  required:
    - stage
    - severity
    - code
    - message
  properties:
    stage:
      type: string
      enum:
        - source
        - filter
        - result
    severity:
      type: string
      enum:
        - info
        - warning
        - error
    code:
      type: string
      examples:
        - SOURCE_BREAKDOWN
        - REMOTE_FALLBACK_USED
        - LOCATION_FILTER_DROPPED
        - LOCATION_FILTER_FALLBACK_USED
        - LINKEDIN_ZERO_RESULTS
        - EXPERIENCE_FILTER_EMPTY
        - PRIORITIZATION_EMPTY
    message:
      type: string
    meta:
      type: object
      additionalProperties: true

DiscoveryUnderstandResult:
  type: object
  required:
    - sourceEndpoint
    - executedAt
    - totals
    - diagnostics
    - findings
    - topRequirementSummary
    - jobs
  properties:
    sourceEndpoint:
      type: string
    executedAt:
      type: string
      format: date-time
    totals:
      type: object
      required:
        - fetched
        - applyRecommended
      properties:
        fetched:
          type: integer
        applyRecommended:
          type: integer
    diagnostics:
      $ref: "#/DiscoveryDiagnostics"
    findings:
      type: array
      items:
        $ref: "#/DiscoveryFinding"
    topRequirementSummary:
      type: array
      items:
        type: object
        required:
          - requirement
          - count
        properties:
          requirement:
            type: string
          count:
            type: integer
    jobs:
      type: array
      items:
        $ref: "#/DetailedDiscoveryJob"

DetailedDiscoveryJob:
  allOf:
    - $ref: "#/ScoredJob"
    - type: object
      required:
        - id
        - location
        - application
        - requirementHighlights
        - faqs
      properties:
        id:
          type: string
        applicationUrl:
          type: string
          format: uri
        application:
          type: object
          required:
            - hasUrl
          properties:
            hasUrl:
              type: boolean
            url:
              type: string
              format: uri
        requirementHighlights:
          type: array
          items:
            type: string
        faqs:
          type: array
          items:
            type: object
            required:
              - question
              - answer
            properties:
              question:
                type: string
              answer:
                type: string

LoginResponse:
  type: object
  properties:
    accessToken: { type: string }
    tokenType: { type: string, example: Bearer }
    expiresIn: { type: integer, example: 43200 }
    expiresAt: { type: string, format: date-time }
Principal:
  type: object
  properties:
    principal:
      type: object
      properties:
        type: { type: string, enum: [api_key, user, anonymous] }
        subject: { type: string }
        expiresAt: { type: string, format: date-time }
ReadinessResponse:
  type: object
  properties:
    ok: { type: boolean }
    checks:
      type: object
      additionalProperties: { type: string }
      example: { mongo: ok, postgres: ok, redis: disabled }
    at: { type: string, format: date-time }
CandidateProfile:
  type: object
  additionalProperties: true
  properties:
    name: { type: string }
    email: { type: string }
    phone: { type: string }
    linkedin: { type: string }
    github: { type: string }
    skills: { type: array, items: { type: string } }
    educationHighlights: { type: array, items: { type: string } }
    experienceHighlights: { type: array, items: { type: string } }
    workHistory:
      type: array
      items:
        type: object
        properties:
          company: { type: string }
          title: { type: string }
          startDate: { type: string, example: Jan 2024 }
          endDate: { type: string, example: Present }
    noticePeriodDays: { type: integer }
    canJoinImmediately: { type: boolean }
    hasNonCompete: { type: boolean }
ManualProfile:
  type: object
  description: Facts the resume parser cannot know (contact details, preferences, salary, skill years).
  properties:
    legalName: { type: string }
    name: { type: string }
    preferredName: { type: string }
    emails: { type: array, items: { type: string, format: email } }
    phones: { type: array, items: { type: string } }
    skills: { type: array, items: { type: string } }
    address:
      type: object
      properties:
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
        full: { type: string }
    profiles:
      type: object
      properties:
        linkedin: { type: string }
        github: { type: string }
        leetcode: { type: string }
    education:
      type: object
      properties:
        university: { type: string }
        degree: { type: string }
        start: { type: string }
        end: { type: string }
    preferences:
      type: object
      properties:
        noticePeriodDays: { type: integer }
        canJoinImmediately: { type: boolean }
        hasNonCompete: { type: boolean }
        visaSponsorshipRequiredInIndia: { type: boolean }
        currentSalaryLpa: { type: string }
        expectedSalaryLpa: { type: number }
        skillYears: { type: object, additionalProperties: { type: number } }
ResumeImportResult:
  type: object
  properties:
    identity: { type: string, enum: [primary, secondary] }
    bytes: { type: integer }
    textLength: { type: integer }
    warnings: { type: array, items: { type: string } }
    profile: { $ref: '#/CandidateProfile' }
ProfileOverview:
  type: object
  properties:
    searchProfile: { $ref: '#/JobProfile' }
    computedExperienceYears: { type: number }
    primary: { type: object, additionalProperties: true }
    secondary: { type: object, additionalProperties: true }
    manualProfile: { $ref: '#/ManualProfile' }
    readyToApply: { type: boolean }
StorageState:
  type: object
  description: Playwright storage state (as produced by `context.storageState()`).
  required: [cookies]
  properties:
    cookies:
      type: array
      items:
        type: object
        required: [name, value, domain]
        properties:
          name: { type: string }
          value: { type: string }
          domain: { type: string }
          path: { type: string }
          expires: { type: number }
          httpOnly: { type: boolean }
          secure: { type: boolean }
          sameSite: { type: string, enum: [Strict, Lax, None] }
    origins:
      type: array
      items:
        type: object
        properties:
          origin: { type: string }
          localStorage:
            type: array
            items: { type: object, properties: { name: { type: string }, value: { type: string } } }
SessionStatus:
  type: object
  properties:
    provider: { type: string, enum: [linkedin, google] }
    enabled: { type: boolean }
    saved: { type: boolean }
    readable: { type: boolean }
    encryptedAtRest: { type: boolean }
    savedAt: { type: string, format: date-time }
    cookieCount: { type: integer }
    hasAuthCookie: { type: boolean }
    authCookieExpiresAt: { type: string, format: date-time }
    expired: { type: boolean }
    interactiveLoginAvailable: { type: boolean }
SessionVerifyResult:
  type: object
  properties:
    provider: { type: string }
    valid: { type: boolean }
    finalUrl: { type: string }
    reason: { type: string }
LoginAttempt:
  type: object
  properties:
    loginId: { type: string, format: uuid }
    provider: { type: string }
    expiresAt: { type: string, format: date-time }
    next: { type: string }
QueuedRun:
  type: object
  properties:
    runId: { type: string }
    status: { type: string, example: queued }
    queuedAt: { type: string, format: date-time }
DiscoveryRunStatus:
  type: object
  properties:
    runId: { type: string }
    status: { type: string, enum: [unknown, running, completed, failed] }
    jobs: { type: integer }
    stages:
      type: array
      items:
        type: object
        properties:
          stage: { type: string, enum: [scrape, score, write] }
          state: { type: string }
          failedReason: { type: string }
StoredJob:
  allOf:
    - $ref: '#/ScoredJob'
    - type: object
      properties:
        id: { type: string, description: "MongoDB id used by /jobs/{id}" }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        scrapeCount: { type: integer }
        lastDiscoveryRunId: { type: string }
JobList:
  type: object
  properties:
    total: { type: integer }
    items: { type: array, items: { $ref: '#/StoredJob' } }
ApplyStoredJobRequest:
  type: object
  properties:
    profile: { $ref: '#/JobProfile' }
    options: { $ref: '#/ApplicationRunOptions' }
QueuedApplication:
  type: object
  properties:
    status: { type: string, example: queued }
    jobId: { type: string }
ApplicationJobStatus:
  type: object
  properties:
    jobId: { type: string }
    state: { type: string, example: completed }
    attemptsMade: { type: integer }
    failedReason: { type: string }
    createdAt: { type: string, format: date-time }
    finishedAt: { type: string, format: date-time }
    outcome: { $ref: '#/ApplicationRunResponse' }
ApplicationList:
  type: object
  properties:
    total: { type: integer }
    items:
      type: array
      items:
        type: object
        properties:
          id: { type: integer }
          jobExternalId: { type: string }
          source: { type: string }
          company: { type: string }
          role: { type: string }
          status: { type: string }
          notes: { type: string, nullable: true }
          applyUrl: { type: string, nullable: true }
          appliedAt: { type: string, format: date-time, nullable: true }
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }
TrackingResult:
  type: object
  properties:
    scannedEmails: { type: integer }
    skippedAlreadyProcessed: { type: integer }
    matchedEmails: { type: integer }
    updates: { type: integer }
    details:
      type: array
      items:
        type: object
        properties:
          subject: { type: string }
          company: { type: string }
          status: { type: string }
          updatedRows: { type: integer }
          reason: { type: string }
ManualReview:
  type: object
  properties:
    id: { type: string }
    status: { type: string, enum: [blocked_manual_review, user_reviewing, resume_requested, resolved] }
    blockerCode: { type: string }
    blockerReason: { type: string }
    company: { type: string }
    title: { type: string }
    applyUrl: { type: string }
    currentUrl: { type: string }
    screenshotPath: { type: string }
    lastStep: { type: string }
    job: { $ref: '#/ScoredJob' }
    runOptions: { $ref: '#/ApplicationRunOptions' }
    notes: { type: string }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }
ReviewNotes:
  type: object
  properties:
    notes: { type: string }
ReviewResumeRequest:
  type: object
  properties:
    notes: { type: string }
    rerun: { type: boolean, default: true, description: Re-run the application after you fixed the blocker. }
    options: { $ref: '#/ApplicationRunOptions' }
